<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Despesas</title>
  </head>
  <body>
    <header>CashControll</header>

    <main>
      <form id="expenseForm">
        <div class="mb-3">
          <label class="form-label">Valor</label>
          <input
            type="number"
            step="0.01"
            class="form-control"
            id="valor"
            placeholder="Digite o valor da despesa"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Onde Gastou</label>
          <input
            type="text"
            class="form-control"
            id="fonte"
            placeholder="Ex: Supermercado, Farmácia..."
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Data</label>
          <input
            type="date"
            class="form-control"
            id="data"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Tipo de Despesa</label>
          <select class="form-select" id="tipo" required>
            <option selected>Selecione o tipo</option>
            <option value="essencial">Essencial</option>
            <option value="variavel">Variável</option>
            <option value="financeiro">Financeiro</option>
            <option value="outros">Outros</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Observação</label>
          <textarea
            class="form-control"
            id="observacao"
            rows="3"
            placeholder="Tem alguma observação?"
          ></textarea>
        </div>
        <button type="button" class="btn btn-success" onclick="adicionarDespesa()">Adicionar Despesa</button>
      </form>

      <div class="essencial">
        <h3>📌 Essencial</h3>
        <table class="tabela-essencial">
          <thead>
            <tr>
              <th>Valor</th>
              <th>Descrição</th>
              <th>Data</th>
              <th>Observação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="variavel">
        <h3>📊 Variável</h3>
        <table class="tabela-variaveis">
          <thead>
            <tr>
              <th>Valor</th>
              <th>Descrição</th>
              <th>Data</th>
              <th>Observação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="financeiro">
        <h3>💰 Financeiro</h3>
        <table class="tabela-financeiros">
          <thead>
            <tr>
              <th>Valor</th>
              <th>Descrição</th>
              <th>Data</th>
              <th>Observação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="outros">
        <h3>🔧 Outros</h3>
        <table class="tabela-outros">
          <thead>
            <tr>
              <th>Valor</th>
              <th>Descrição</th>
              <th>Data</th>
              <th>Observação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <a class="back-btn" href="dashboard.html" aria-label="Voltar para dashboard">← Voltar</a>

    <footer></footer>

    <script type="module" src="js/expenses.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
